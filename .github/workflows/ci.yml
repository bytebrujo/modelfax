# PR gate. Unmergeable unless green (branch protection requires this check).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Runner: the Namespace profile (namespace-profile-brujo), matching the rest of
# this account's CI. Faster machines and a persistent cache. Override per-repo
# without editing this file by setting the NAMESPACE_RUNNER Actions variable;
# set it to ubuntu-latest to fall back to GitHub-hosted runners if Namespace is
# unavailable.

jobs:
  check:
    name: make check
    runs-on: ${{ vars.NAMESPACE_RUNNER || 'namespace-profile-brujo' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: make check
