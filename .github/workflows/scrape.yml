# Daily scrape (build spec §5.4).
#   exit 3 → open a data PR (data/ diffs only)
#   exit 4/5 → open or update the `maintenance` issue with the structured error
#
# NOTE: pull requests opened with the default GITHUB_TOKEN do not trigger
# `pull_request` workflows, so CI would never run on the data PR. Set a repo
# secret SCRAPE_PAT (fine-grained PAT: contents + pull-requests + issues, this
# repo only) and the workflow uses it; otherwise it falls back to GITHUB_TOKEN.
name: scrape

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.SCRAPE_PAT || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SCRAPE_PAT || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Run scrapers
        id: scrape
        run: |
          set +e
          node scrapers/run.js > scrape.log 2> scrape.err
          code=$?
          set -e
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          cat scrape.log scrape.err
          if [ "$code" -ne 0 ] && [ "$code" -ne 3 ] && [ "$code" -ne 4 ] && [ "$code" -ne 5 ]; then
            echo '{"level":"error","component":"scrape.yml","msg":"unexpected exit code","code":'"$code"'}'
            exit 1
          fi

      - name: Verify changed data still passes make check
        if: steps.scrape.outputs.exit == '3'
        run: make check

      - name: Open data PR
        if: steps.scrape.outputs.exit == '3'
        env:
          DATE: ${{ github.run_started_at }}
        run: |
          set -euo pipefail
          day="${DATE%%T*}"
          providers=$(git diff --name-only -- data | sed -E 's#data/(.*)\.json#\1#' | paste -sd, -)
          branch="data/${day}-${{ github.run_id }}"
          git config user.name "modelfax-bot"
          git config user.email "modelfax-bot@users.noreply.github.com"
          git checkout -b "$branch"
          git add data
          git commit -m "data: ${providers} ${day}"
          git push -u origin "$branch"
          {
            echo "Automated scrape on ${day}. Only \`data/\` changed."
            echo
            echo '```json'
            grep -E '"msg":"(field changed|diff)"' scrape.log || true
            echo '```'
          } > pr-body.md
          gh pr create --title "data: ${providers} ${day}" --body-file pr-body.md --label data --base main --head "$branch"

      - name: Open or update maintenance issue
        if: steps.scrape.outputs.exit == '4' || steps.scrape.outputs.exit == '5'
        env:
          CODE: ${{ steps.scrape.outputs.exit }}
        run: |
          set -euo pipefail
          kind="parse failure"; [ "$CODE" = "5" ] && kind="fetch failure"
          title="scrape: ${kind} (exit ${CODE})"
          {
            echo "The daily scrape exited ${CODE} (${kind}) on run ${{ github.run_id }}."
            echo "Fix per AGENTS.md rule 6: new fixture + parser change + test change in one PR."
            echo
            echo '```json'
            grep -E '"level":"error"' scrape.err || true
            echo '```'
          } > issue-body.md
          existing=$(gh issue list --label maintenance --state open --search "in:title \"scrape:\"" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file issue-body.md
            gh issue edit "$existing" --title "$title"
          else
            gh issue create --title "$title" --body-file issue-body.md --label maintenance
          fi
