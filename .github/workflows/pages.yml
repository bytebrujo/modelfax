# Deploy site/ + data/ + schema/ to GitHub Pages on every merge to main.
# Layout at the Pages root: index.html, calculator.html, site.css, site.js,
# data/<provider>.json, schema/model.schema.json. Paths never change within a
# schema major (README: API stability promise).
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ vars.NAMESPACE_RUNNER || 'namespace-profile-brujo' }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble _site
        run: make build-site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ${{ vars.NAMESPACE_RUNNER || 'namespace-profile-brujo' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
